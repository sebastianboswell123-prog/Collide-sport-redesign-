<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Collide Sport — Premium rugby scrum caps and activewear. Designed in South Africa, built for the field." />
    <meta property="og:title" content="COLLIDE SPORT — Play Hard" />
    <meta property="og:description" content="Premium rugby scrum caps and activewear. Designed in South Africa." />
    <meta name="theme-color" content="#0e1b4d" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <title>COLLIDE SPORT — Play Hard</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Product/hero imagery is served from the Shopify CDN — connect early to cut LCP -->
    <link rel="preconnect" href="https://collidesport.co.za" crossorigin />
    <link rel="dns-prefetch" href="https://collidesport.co.za" />
  </head>
  <body>
    <div id="root">
      <!--
        Static pre-render shell — gives Chrome something to paint (FCP) before
        the JS bundle loads. React replaces this on mount.
        Background matches the CurtainReveal so there's no flash.
      -->
      <div id="app-shell" style="position:fixed;inset:0;background:#0e1b4d;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true">
          <circle cx="40" cy="40" r="32" fill="none" stroke="#4770db" stroke-width="5" stroke-dasharray="150 50" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="0.9s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Custom cursor tracking
      if (matchMedia('(pointer:fine)').matches) {
        document.addEventListener('mousemove', function(e) {
          document.body.style.setProperty('--cx', e.clientX + 'px');
          document.body.style.setProperty('--cy', e.clientY + 'px');
        });
      }
    </script>
  </body>
</html>
