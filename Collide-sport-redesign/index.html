<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Collide Sport — Premium rugby scrum caps and activewear. Designed in South Africa, built for the field." />
    <meta property="og:title" content="COLLIDE SPORT — Play Hard" />
    <meta property="og:description" content="Premium rugby scrum caps and activewear. Designed in South Africa." />
    <meta name="theme-color" content="#0e1b4d" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <title>COLLIDE SPORT — Play Hard</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Product/hero imagery is served from the Shopify CDN — connect early to cut LCP -->
    <link rel="preconnect" href="https://collidesport.co.za" crossorigin />
    <link rel="dns-prefetch" href="https://collidesport.co.za" />
  </head>
  <body>
    <div id="root">
      <!--
        Static pre-render shell — gives Chrome something to paint (FCP) before
        the JS bundle loads. React replaces this on mount.
        Background matches the CurtainReveal so there's no flash.
      -->
      <div id="app-shell" style="position:fixed;inset:0;background:#0e1b4d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:9999;">
        <!-- Text node = guaranteed LCP candidate for Lighthouse; spinner is decorative only -->
        <p style="margin:0;color:#ffffff;font-family:system-ui,sans-serif;font-size:1.125rem;font-weight:700;letter-spacing:0.2em;">COLLIDE SPORT</p>
        <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true" style="opacity:0.6;">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#4770db" stroke-width="3" stroke-dasharray="60 40" stroke-linecap="round" style="transform-origin:center;animation:spin 0.9s linear infinite;"/>
        </svg>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Custom cursor tracking
      if (matchMedia('(pointer:fine)').matches) {
        document.addEventListener('mousemove', function(e) {
          document.body.style.setProperty('--cx', e.clientX + 'px');
          document.body.style.setProperty('--cy', e.clientY + 'px');
        });
      }
    </script>
  </body>
</html>
